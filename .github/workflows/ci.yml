name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (PostgreSQL/pgvector) + RAG evaluation set
      - name: Build and test
        run: mvn -B verify
      - name: Build Docker image
        run: docker build -t secure-rag-policy-engine:${{ github.sha }} .
